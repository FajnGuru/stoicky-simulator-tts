    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts: Poppins & Lato -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind Custom Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                        lato: ['Lato', 'sans-serif'],
                    },
                    colors: {
                        stoic: {
                            gold: '#f59e0b',
                            goldLight: '#fbbf24',
                            cyan: '#38bdf8',
                            dark: '#0f172a',
                            card: '#1e293b'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        [x-cloak] { display: none !important; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .slide-glow {
            background: radial-gradient(circle at 90% 10%, rgba(99, 102, 241, 0.12), transparent 45%),
                        radial-gradient(circle at 10% 90%, rgba(245, 158, 11, 0.08), transparent 45%);
        }

        .audio-wave-bar {
            animation: wave 1.2s ease-in-out infinite alternate;
        }
        .audio-wave-bar:nth-child(2) { animation-delay: 0.2s; }
        .audio-wave-bar:nth-child(3) { animation-delay: 0.4s; }

        @keyframes wave {
            0% { height: 4px; }
            100% { height: 16px; }
        }
    </style>

    <!-- Alpine.js for lightweight state management -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
