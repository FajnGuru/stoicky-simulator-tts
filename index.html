<!DOCTYPE html>
<html lang="cs" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stoický Simulátor - Interaktivní Prezentace s AI TTS</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts: Poppins & Lato -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind Custom Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                        lato: ['Lato', 'sans-serif'],
                    },
                    colors: {
                        stoic: {
                            gold: '#f59e0b',
                            goldLight: '#fbbf24',
                            cyan: '#38bdf8',
                            dark: '#0f172a',
                            card: '#1e293b'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        [x-cloak] { display: none !important; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .slide-glow {
            background: radial-gradient(circle at 90% 10%, rgba(99, 102, 241, 0.12), transparent 45%),
                        radial-gradient(circle at 10% 90%, rgba(245, 158, 11, 0.08), transparent 45%);
        }

        .audio-wave-bar {
            animation: wave 1.2s ease-in-out infinite alternate;
        }
        .audio-wave-bar:nth-child(2) { animation-delay: 0.2s; }
        .audio-wave-bar:nth-child(3) { animation-delay: 0.4s; }

        @keyframes wave {
            0% { height: 4px; }
            100% { height: 16px; }
        }
    </style>

    <!-- Alpine.js for lightweight state management -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="h-full bg-slate-950 text-slate-100 font-lato antialiased flex flex-col select-none overflow-hidden" x-data="presentationApp()">

    <header class="h-16 border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50 px-4 sm:px-6 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 to-indigo-500 flex items-center justify-center text-slate-950 font-bold shadow-lg shadow-amber-500/20">
                <i class="fa-solid fa-volume-high text-slate-950"></i>
            </div>
            <div>
                <h1 class="text-sm sm:text-base font-bold font-poppins text-slate-100 flex items-center gap-2">
                    Stoický Simulátor <span class="text-xs px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/30 font-mono">AI TTS Edition</span>
                </h1>
                <p class="text-[11px] text-slate-400 hidden sm:block">Interaktivní prezentace s českým audio předčítáním (Gemini 2.5 TTS)</p>
            </div>
        </div>

        <!-- Header Controls -->
        <div class="flex items-center gap-2 sm:gap-4">
            <!-- Autoplay Toggle -->
            <button @click="toggleAutoplay()" :class="autoplay ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40' : 'bg-slate-800/80 text-slate-400 border-slate-700'" class="px-3 py-1.5 rounded-xl border text-xs font-semibold transition flex items-center gap-1.5">
                <i class="fa-solid" :class="autoplay ? 'fa-play text-emerald-400' : 'fa-pause'"></i>
                <span class="hidden md:inline" x-text="autoplay ? 'Automatické přehrávání: ZAP' : 'Automatické přehrávání: VYP'"></span>
            </button>

            <!-- TTS Voice Selector Menu -->
            <div class="relative" x-data="{ open: false }">
                <button @click="open = !open" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1.5">
                    <i class="fa-solid fa-microphone-lines text-amber-400"></i>
                    <span class="hidden sm:inline" x-text="selectedVoiceLabel"></span>
                    <i class="fa-solid fa-chevron-down text-[10px] ml-1"></i>
                </button>
                <div x-show="open" @click.outside="open = false" x-cloak class="absolute right-0 mt-2 w-60 bg-slate-900 border border-slate-800 rounded-xl shadow-2xl py-2 z-50 text-xs space-y-1">
                    <div class="px-3 py-1 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Hlasové rozhraní (Gemini TTS)</div>
                    <button @click="setVoice('gemini', 'Zephyr'); open = false" :class="selectedVoice === 'Zephyr' && selectedVoiceType === 'gemini' ? 'bg-amber-500/10 text-amber-400' : 'text-slate-300 hover:bg-slate-800'" class="w-full text-left px-3 py-1.5 transition flex items-center justify-between">
                        <span>✨ Gemini - Zephyr (Jasný)</span>
                        <i x-show="selectedVoice === 'Zephyr' && selectedVoiceType === 'gemini'" class="fa-solid fa-check text-amber-400"></i>
                    </button>
                    <button @click="setVoice('gemini', 'Puck'); open = false" :class="selectedVoice === 'Puck' && selectedVoiceType === 'gemini' ? 'bg-amber-500/10 text-amber-400' : 'text-slate-300 hover:bg-slate-800'" class="w-full text-left px-3 py-1.5 transition flex items-center justify-between">
                        <span>✨ Gemini - Puck (Energický)</span>
                        <i x-show="selectedVoice === 'Puck' && selectedVoiceType === 'gemini'" class="fa-solid fa-check text-amber-400"></i>
                    </button>
                    <button @click="setVoice('gemini', 'Kore'); open = false" :class="selectedVoice === 'Kore' && selectedVoiceType === 'gemini' ? 'bg-amber-500/10 text-amber-400' : 'text-slate-300 hover:bg-slate-800'" class="w-full text-left px-3 py-1.5 transition flex items-center justify-between">
                        <span>✨ Gemini - Kore (Rázný)</span>
                        <i x-show="selectedVoice === 'Kore' && selectedVoiceType === 'gemini'" class="fa-solid fa-check text-amber-400"></i>
                    </button>
                    <button @click="setVoice('gemini', 'Aoede'); open = false" :class="selectedVoice === 'Aoede' && selectedVoiceType === 'gemini' ? 'bg-amber-500/10 text-amber-400' : 'text-slate-300 hover:bg-slate-800'" class="w-full text-left px-3 py-1.5 transition flex items-center justify-between">
                        <span>✨ Gemini - Aoede (Jemný)</span>
                        <i x-show="selectedVoice === 'Aoede' && selectedVoiceType === 'gemini'" class="fa-solid fa-check text-amber-400"></i>
                    </button>
                    <div class="border-t border-slate-800 my-1"></div>
                    <button @click="setVoice('browser', 'native'); open = false" :class="selectedVoiceType === 'browser' ? 'bg-amber-500/10 text-amber-400' : 'text-slate-300 hover:bg-slate-800'" class="w-full text-left px-3 py-1.5 transition flex items-center justify-between">
                        <span>🌐 Systémový hlas prohlížeče</span>
                        <i x-show="selectedVoiceType === 'browser'" class="fa-solid fa-check text-amber-400"></i>
                    </button>
                    <button @click="setVoice('custom', 'local'); open = false" :class="selectedVoiceType === 'custom' ? 'bg-amber-500/10 text-amber-400' : 'text-slate-300 hover:bg-slate-800'" class="w-full text-left px-3 py-1.5 transition flex items-center justify-between">
                        <span>📁 Vlastní audio ze zařízení</span>
                        <i x-show="selectedVoiceType === 'custom'" class="fa-solid fa-check text-amber-400"></i>
                    </button>
                </div>
            </div>

            <!-- Fullscreen Toggle Button -->
            <button @click="toggleFullscreen()" class="p-2 text-slate-400 hover:text-slate-100 transition rounded-xl hover:bg-slate-800" title="Celá obrazovka">
                <i class="fa-solid" :class="isFullscreen ? 'fa-compress' : 'fa-expand'"></i>
            </button>
        </div>
    </header>

    <main class="flex-grow relative flex items-center justify-center p-3 sm:p-6 md:p-8 overflow-hidden bg-slate-950">
        <!-- Slide Stage Container -->
        <div id="slideStage" class="w-full max-w-5xl h-full max-h-[750px] bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl relative flex flex-col justify-between overflow-hidden slide-glow p-5 sm:p-8 transition-all duration-300">
            
            <!-- Slide Top Bar: Category & Audio Controls -->
            <div class="flex items-center justify-between gap-4 border-b border-slate-800/80 pb-3 shrink-0">
                <div class="flex items-center gap-2 text-xs font-mono text-slate-400">
                    <span class="text-amber-400 font-bold font-poppins text-sm" x-text="'SLIDE ' + (currentSlideIndex + 1) + ' / ' + slides.length"></span>
                    <span>•</span>
                    <span x-text="currentSlide.category"></span>
                </div>

                <!-- Main TTS Audio Control & Download Buttons -->
                <div class="flex items-center gap-2">
                    <!-- Hidden Custom Audio File Input -->
                    <input type="file" x-ref="customAudioInput" @change="handleCustomAudioUpload($event)" accept="audio/*" class="hidden">

                    <!-- Custom Audio Badge Indicator -->
                    <template x-if="hasCustomAudio(currentSlideIndex)">
                        <div class="flex items-center gap-1.5 bg-indigo-950/80 border border-indigo-500/40 text-indigo-300 px-2.5 py-1.5 rounded-xl text-xs">
                            <i class="fa-solid fa-file-audio text-amber-400"></i>
                            <span class="max-w-[100px] truncate text-[11px]" x-text="customAudioMap[currentSlideIndex].filename"></span>
                            <button @click="removeCustomAudio(currentSlideIndex)" class="text-rose-400 hover:text-rose-300 ml-1 p-0.5" title="Odebrat vlastní audio pro tento slide">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                    </template>

                    <!-- Upload Custom Audio Button -->
                    <button @click="$refs.customAudioInput.click()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 p-2.5 rounded-xl text-xs transition flex items-center justify-center shadow-lg group" title="Nahrát vlastní audio z paměti mobilu nebo PC pro tento slide">
                        <i class="fa-solid fa-file-arrow-up text-amber-400 group-hover:scale-110 transition text-sm"></i>
                    </button>

                    <!-- Download Button (Diskette Icon) -->
                    <button x-show="hasAudio(currentSlideIndex)" @click="downloadAudio(currentSlideIndex)" class="bg-slate-800 hover:bg-slate-700 text-amber-400 border border-amber-500/40 p-2.5 rounded-xl text-xs transition flex items-center justify-center shadow-lg group" title="Uložit audio (WAV / MP3)">
                        <i class="fa-solid fa-floppy-disk text-amber-400 group-hover:scale-110 transition text-sm"></i>
                    </button>

                    <!-- Main TTS Audio Control Button for the current slide -->
                    <button @click="speakCurrentSlide()" :disabled="ttsLoading" :class="isSpeaking ? 'bg-amber-500 text-slate-950 font-bold border-amber-400' : 'bg-slate-800 hover:bg-slate-700 text-amber-400 border-amber-500/30'" class="px-4 py-2 rounded-xl border text-xs transition flex items-center gap-2 shadow-lg group">
                        <template x-if="!ttsLoading && !isSpeaking">
                            <span class="flex items-center gap-2">
                                <i class="fa-solid fa-volume-high text-amber-400 group-hover:scale-110 transition"></i>
                                <span x-text="hasCustomAudio(currentSlideIndex) || selectedVoiceType === 'custom' ? 'Přehrát vlastní audio ze zařízení' : 'Přehrát hlasový doprovod (CZ)'"></span>
                            </span>
                        </template>
                        <template x-if="ttsLoading">
                            <span class="flex items-center gap-2">
                                <i class="fa-solid fa-spinner fa-spin text-amber-400"></i>
                                <span>Generuji audio (Gemini AI)...</span>
                            </span>
                        </template>
                        <template x-if="isSpeaking && !ttsLoading">
                            <span class="flex items-center gap-2">
                                <i class="fa-solid fa-square text-slate-950"></i>
                                <span>Zastavit přehrávání</span>
                                <span class="flex items-end gap-0.5 h-3 ml-1">
                                    <span class="w-1 bg-slate-950 rounded-full audio-wave-bar"></span>
                                    <span class="w-1 bg-slate-950 rounded-full audio-wave-bar"></span>
                                    <span class="w-1 bg-slate-950 rounded-full audio-wave-bar"></span>
                                </span>
                            </span>
                        </template>
                    </button>
                </div>
            </div>

            <!-- Main Content Area -->
            <div class="flex-grow overflow-y-auto my-3 pr-1 space-y-4 flex flex-col justify-center">

                <!-- LAYOUT 1: TITLE SLIDE -->
                <template x-if="currentSlide.layout === 'title'">
                    <div class="text-center space-y-6 my-auto py-6">
                        <div class="inline-block px-4 py-1.5 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs font-bold uppercase tracking-wider font-poppins" x-text="currentSlide.badge"></div>
                        <h1 class="text-3xl sm:text-5xl font-extrabold font-poppins text-slate-100 leading-tight" x-text="currentSlide.title"></h1>
                        <p class="text-base sm:text-xl text-slate-300 max-w-2xl mx-auto font-lato" x-text="currentSlide.subtitle"></p>
                    </div>
                </template>

                <!-- LAYOUT 2: SECTION TITLE -->
                <template x-if="currentSlide.layout === 'section_title'">
                    <div class="text-center space-y-4 my-auto py-8">
                        <div class="w-16 h-1 bg-amber-500 mx-auto rounded-full"></div>
                        <h2 class="text-3xl sm:text-5xl font-bold font-poppins text-slate-100" x-text="currentSlide.title"></h2>
                        <p class="text-base sm:text-xl text-slate-400 max-w-2xl mx-auto" x-text="currentSlide.subtitle"></p>
                    </div>
                </template>

                <!-- LAYOUT 3: TWO COLUMN TILED -->
                <template x-if="currentSlide.layout === 'two_column_tiled'">
                    <div class="space-y-6">
                        <h2 class="text-2xl sm:text-3xl font-bold font-poppins text-cyan-400" x-text="currentSlide.title"></h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <template x-for="tile in currentSlide.tiles" :key="tile.heading">
                                <div class="bg-slate-950 border border-slate-800 p-6 rounded-2xl space-y-3">
                                    <h3 class="text-lg font-bold font-poppins text-amber-400" x-text="tile.heading"></h3>
                                    <p class="text-sm text-slate-300 leading-relaxed" x-html="tile.text"></p>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- LAYOUT 4: TILED CARDS WITH ICONS -->
                <template x-if="currentSlide.layout === 'tiled_icons'">
                    <div class="space-y-6">
                        <h2 class="text-2xl sm:text-3xl font-bold font-poppins text-cyan-400" x-text="currentSlide.title"></h2>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                            <template x-for="card in currentSlide.cards" :key="card.heading">
                                <div class="bg-slate-950 border border-slate-800 p-6 rounded-2xl space-y-3">
                                    <div class="text-3xl text-amber-400 mb-2" x-html="card.icon"></div>
                                    <h3 class="text-base font-bold font-poppins text-cyan-400" x-text="card.heading"></h3>
                                    <p class="text-xs sm:text-sm text-slate-300 leading-relaxed" x-text="card.text"></p>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- LAYOUT 5: HIGHLIGHTED NUMBERS -->
                <template x-if="currentSlide.layout === 'highlight_numbers'">
                    <div class="space-y-6">
                        <h2 class="text-2xl sm:text-3xl font-bold font-poppins text-cyan-400" x-text="currentSlide.title"></h2>
                        <div class="grid grid-cols-1 md:grid-cols-12 gap-8 items-center bg-slate-950 border border-slate-800 p-8 rounded-2xl">
                            <div class="md:col-span-4 text-center border-b md:border-b-0 md:border-r border-slate-800 pb-6 md:pb-0 md:pr-6">
                                <div class="text-7xl sm:text-8xl font-black font-poppins text-amber-400 leading-none" x-text="currentSlide.number"></div>
                                <div class="text-lg font-semibold font-poppins text-cyan-400 mt-2" x-text="currentSlide.numberLabel"></div>
                            </div>
                            <div class="md:col-span-8 space-y-3">
                                <h3 class="text-xl font-bold font-poppins text-slate-100" x-text="currentSlide.heading"></h3>
                                <p class="text-sm sm:text-base text-slate-300 leading-relaxed" x-html="currentSlide.description"></p>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- LAYOUT 6: STYLED BULLET POINTS -->
                <template x-if="currentSlide.layout === 'bullet_points'">
                    <div class="space-y-6">
                        <h2 class="text-2xl sm:text-3xl font-bold font-poppins text-cyan-400" x-text="currentSlide.title"></h2>
                        <div class="bg-slate-950 border border-slate-800 p-6 sm:p-8 rounded-2xl">
                            <ul class="space-y-4">
                                <template x-for="item in currentSlide.items" :key="item.title">
                                    <li class="flex items-start gap-4">
                                        <div class="w-8 h-8 rounded-lg bg-amber-500/10 border border-amber-500/30 text-amber-400 flex items-center justify-center shrink-0 mt-0.5">
                                            <i :class="item.icon" class="text-sm"></i>
                                        </div>
                                        <div class="text-sm sm:text-base text-slate-200 leading-relaxed">
                                            <strong class="text-amber-400 font-poppins" x-text="item.title + ': '"></strong>
                                            <span x-text="item.text"></span>
                                        </div>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </div>
                </template>

                <!-- LAYOUT 7: BLEED IMAGE WITH TEXT -->
                <template x-if="currentSlide.layout === 'image_side'">
                    <div class="space-y-4">
                        <h2 class="text-2xl sm:text-3xl font-bold font-poppins text-cyan-400" x-text="currentSlide.title"></h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
                            <div class="bg-slate-950 border border-slate-800 p-6 rounded-2xl space-y-4">
                                <h3 class="text-xl font-bold font-poppins text-slate-100" x-text="currentSlide.heading"></h3>
                                <p class="text-sm text-slate-300 leading-relaxed" x-text="currentSlide.description"></p>
                                <div class="bg-amber-950/40 border border-amber-500/40 p-4 rounded-xl space-y-1">
                                    <div class="text-xs text-amber-400 font-bold uppercase tracking-wider">Doporučená reakce k odeslání:</div>
                                    <div class="text-sm font-bold text-slate-100" x-text="currentSlide.quote"></div>
                                    <div class="text-[11px] text-slate-400 italic" x-text="currentSlide.quoteNote"></div>
                                </div>
                            </div>
                            <div class="rounded-2xl overflow-hidden border border-slate-800 max-h-72 shadow-xl">
                                <img :src="currentSlide.imageUrl" :alt="currentSlide.title" class="w-full h-full object-cover">
                            </div>
                        </div>
                    </div>
                </template>

                <!-- LAYOUT 8: COMPARISON TABLE -->
                <template x-if="currentSlide.layout === 'table'">
                    <div class="space-y-5">
                        <h2 class="text-2xl sm:text-3xl font-bold font-poppins text-cyan-400" x-text="currentSlide.title"></h2>
                        <div class="bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden shadow-lg">
                            <table class="w-full text-left text-xs sm:text-sm">
                                <thead>
                                    <tr class="bg-slate-900 border-b border-slate-800 text-amber-400 font-poppins">
                                        <th class="p-3 sm:p-4">Oblast Reakce</th>
                                        <th class="p-3 sm:p-4 text-rose-400">Reaktivní Přístup (Nízký Status)</th>
                                        <th class="p-3 sm:p-4 text-emerald-400">Stoický Přístup (Vysoký Status)</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-800/80 text-slate-300">
                                    <template x-for="row in currentSlide.rows" :key="row.category">
                                        <tr class="hover:bg-slate-900/50 transition">
                                            <td class="p-3 sm:p-4 font-bold text-slate-200" x-text="row.category"></td>
                                            <td class="p-3 sm:p-4 text-slate-400" x-text="row.reactive"></td>
                                            <td class="p-3 sm:p-4 text-slate-100 font-medium" x-text="row.stoic"></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </template>

                <!-- LAYOUT 9: TIMELINE STEPPER -->
                <template x-if="currentSlide.layout === 'timeline'">
                    <div class="space-y-6">
                        <h2 class="text-2xl sm:text-3xl font-bold font-poppins text-cyan-400" x-text="currentSlide.title"></h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                            <template x-for="(step, idx) in currentSlide.steps" :key="step.title">
                                <div class="bg-slate-950 border border-slate-800 p-5 rounded-2xl relative space-y-2">
                                    <div class="w-7 h-7 rounded-full bg-amber-500 text-slate-950 font-bold font-poppins text-xs flex items-center justify-center mb-2" x-text="idx + 1"></div>
                                    <h3 class="text-base font-bold font-poppins text-cyan-400" x-text="step.title"></h3>
                                    <p class="text-xs text-slate-300 leading-relaxed" x-text="step.description"></p>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- LAYOUT 10: QUOTE -->
                <template x-if="currentSlide.layout === 'quote'">
                    <div class="text-center space-y-6 max-w-2xl mx-auto my-auto py-6">
                        <i class="fa-solid fa-quote-left text-5xl text-amber-500/40"></i>
                        <blockquote class="text-2xl sm:text-3xl font-semibold font-poppins text-slate-100 leading-snug" x-text="currentSlide.quoteText"></blockquote>
                        <cite class="block text-lg font-lato text-cyan-400 not-italic" x-text="'— ' + currentSlide.author"></cite>
                    </div>
                </template>

                <!-- LAYOUT 11: QA / OUTRO -->
                <template x-if="currentSlide.layout === 'outro'">
                    <div class="text-center space-y-6 max-w-2xl mx-auto my-auto py-8">
                        <h2 class="text-4xl sm:text-6xl font-black font-poppins text-slate-100" x-text="currentSlide.title"></h2>
                        <p class="text-xl text-cyan-400 font-semibold" x-text="currentSlide.subtitle"></p>
                        <div class="text-sm text-slate-400 border-t border-slate-800 pt-6 mt-4" x-text="currentSlide.contact"></div>
                    </div>
                </template>

            </div>

            <!-- Slide Narrator Script Drawer -->
            <div class="bg-slate-950/90 border border-slate-800 p-3 rounded-xl text-xs space-y-1 my-2 shrink-0">
                <div class="flex items-center justify-between text-[11px] text-slate-400 font-bold">
                    <span class="flex items-center gap-1.5 text-amber-400">

                nextSlide() {
                    if (this.currentSlideIndex < this.slides.length - 1) {
                        this.stopAudio();
                        this.currentSlideIndex++;
                        if (this.autoplay) {
                            setTimeout(() => this.speakCurrentSlide(), 400);
                        }
                    }
                },

                prevSlide() {
                    if (this.currentSlideIndex > 0) {
                        this.stopAudio();
                        this.currentSlideIndex--;
                        if (this.autoplay) {
                            setTimeout(() => this.speakCurrentSlide(), 400);
                        }
                    }
                },

                goToSlide(index) {
                    this.stopAudio();
                    this.currentSlideIndex = index;
                    if (this.autoplay) {
                        setTimeout(() => this.speakCurrentSlide(), 400);
                    }
                },

                toggleAutoplay() {
                    this.autoplay = !this.autoplay;
                    if (this.autoplay && !this.isSpeaking) {
                        this.speakCurrentSlide();
                    }
                },

                toggleFullscreen() {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().catch(err => console.error(err));
                        this.isFullscreen = true;
                    } else {
                        if (document.exitFullscreen) {
                            document.exitFullscreen();
                            this.isFullscreen = false;
                        }
                    }
                },

                setVoice(type, name) {
                    this.selectedVoiceType = type;
                    this.selectedVoice = name;
                    if (type === 'custom' && !this.hasCustomAudio(this.currentSlideIndex)) {
                        this.$refs.customAudioInput.click();
                    } else if (this.isSpeaking) {
                        this.stopAudio();
                        this.speakCurrentSlide();
                    }
                },

                hasCustomAudio(index = this.currentSlideIndex) {
                    return !!(this.customAudioMap[index] && this.customAudioMap[index].url);
                },

                hasAudio(index) {
                    return !!(this.hasCustomAudio(index) || (this.audioCache[index] && this.audioCache[index].url));
                },

                handleCustomAudioUpload(event, index = this.currentSlideIndex) {
                    const file = event.target.files[0];
                    if (!file) return;
                    const url = URL.createObjectURL(file);
                    this.customAudioMap[index] = {
                        url: url,
                        filename: file.name,
                        file: file
                    };
                    this.selectedVoiceType = 'custom';
                    event.target.value = '';
                },

                removeCustomAudio(index = this.currentSlideIndex) {
                    if (this.customAudioMap[index]) {
                        URL.revokeObjectURL(this.customAudioMap[index].url);
                        delete this.customAudioMap[index];
                    }
                    if (this.selectedVoiceType === 'custom' && !this.hasCustomAudio(index)) {
                        this.selectedVoiceType = 'gemini';
                    }
                },

                downloadAudio(index = this.currentSlideIndex) {
                    let cached = this.customAudioMap[index];
                    if (!cached || !cached.url) {
                        cached = this.audioCache[index];
                    }
                    if (!cached || !cached.url) return;
                    const a = document.createElement('a');
                    a.href = cached.url;
                    a.download = cached.filename || `slide_${index + 1}_audio.wav`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                },

                async speakCurrentSlide() {
                    if (this.isSpeaking) {
                        this.stopAudio();
                        return;
                    }

                    // Priority: if custom audio file exists for this slide or 'custom' mode selected
                    if (this.hasCustomAudio(this.currentSlideIndex) || this.selectedVoiceType === 'custom') {
                        if (this.hasCustomAudio(this.currentSlideIndex)) {
                            this.playCustomAudio(this.currentSlideIndex);
                            return;
                        } else {
                            // Prompt user to select audio file for this slide
                            this.$refs.customAudioInput.click();
                            return;
                        }
                    }

                    const scriptText = this.currentSlide.narrationScript;
                    if (!scriptText) return;

                    // Reuse cached audio if generated for current slide & voice
                    if (this.selectedVoiceType === 'gemini' && this.audioCache[this.currentSlideIndex] && this.audioCache[this.currentSlideIndex].voice === this.selectedVoice) {
                        this.playCachedAudio(this.currentSlideIndex);
                        return;
                    }

                    this.ttsLoading = true;

                    if (this.selectedVoiceType === 'gemini') {
                        try {
                            await this.playGeminiTTS(scriptText, this.selectedVoice);
                        } catch (err) {
                            console.warn("Gemini TTS API Unavailable, switching to Browser SpeechSynthesis Fallback:", err);
                            this.playBrowserTTS(scriptText);
                        } finally {
                            this.ttsLoading = false;
                        }
                    } else {
                        this.playBrowserTTS(scriptText);
                        this.ttsLoading = false;
                    }
                },

                playCustomAudio(index) {
                    const custom = this.customAudioMap[index];
                    if (!custom || !custom.url) return;

                    const audio = new Audio(custom.url);
                    this.currentAudioSource = audio;
                    this.isSpeaking = true;

                    audio.onended = () => {
                        this.isSpeaking = false;
                        this.currentAudioSource = null;
                        if (this.autoplay && this.currentSlideIndex < this.slides.length - 1) {
                            setTimeout(() => this.nextSlide(), 800);
                        }
                    };

                    audio.onerror = () => {
                        this.isSpeaking = false;
                        this.currentAudioSource = null;
                    };

                    audio.play().catch(err => console.error("Error playing custom audio file:", err));
                },

                async playGeminiTTS(text, voiceName) {
                    const apiKey = "";
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;

                    const promptText = `Say cheerfully and clearly in fluent Czech: ${text}`;

                    const payload = {
                        contents: [{
                            parts: [{ text: promptText }]
                        }],
                        generationConfig: {
                            responseModalities: ["AUDIO"],
                            speechConfig: {
                                voiceConfig: {
                                    prebuiltVoiceConfig: { voiceName: voiceName }
                                }
                            }
                        }
                    };

                    let res = null;
                    let retries = 0;
                    while (retries < 2) {
                        try {
                            res = await fetch(apiUrl, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payload)
                            });
                            if (res.ok) break;
                            throw new Error("HTTP error " + res.status);
                        } catch (e) {
                            retries++;
                            if (retries >= 2) throw e;
                            await new Promise(r => setTimeout(r, 1000));
                        }
                    }

                    const data = await res.json();
                    const part = data?.candidates?.[0]?.content?.parts?.[0];
                    const base64Audio = part?.inlineData?.data;
                    const mimeType = part?.inlineData?.mimeType || "audio/L16;rate=24000";

                    if (!base64Audio) throw new Error("No audio data returned from Gemini TTS");

                    let sampleRate = 24000;
                    const match = mimeType.match(/rate=(\d+)/);
                    if (match && match[1]) {
                        sampleRate = parseInt(match[1], 10);
                    }

                    const pcmData = this.base64ToArrayBuffer(base64Audio);
                    const pcm16 = new Int16Array(pcmData);
                    const wavBlob = this.pcmToWav(pcm16, sampleRate);
                    const audioUrl = URL.createObjectURL(wavBlob);

                    this.audioCache[this.currentSlideIndex] = {
                        url: audioUrl,
                        blob: wavBlob,
                        voice: voiceName,
                        filename: `stoicky_simulator_slide_${this.currentSlideIndex + 1}_${voiceName.toLowerCase()}.wav`
                    };

                    const audio = new Audio(audioUrl);
                    this.currentAudioSource = audio;
                    this.isSpeaking = true;

                    audio.onended = () => {
                        this.isSpeaking = false;
                        this.currentAudioSource = null;
                        if (this.autoplay && this.currentSlideIndex < this.slides.length - 1) {
                            setTimeout(() => this.nextSlide(), 800);
                        }
                    };

                    audio.onerror = () => {
                        this.isSpeaking = false;
                        this.currentAudioSource = null;
                    };

                    await audio.play();
                },

                playCachedAudio(index) {
                    const cached = this.audioCache[index];
                    if (!cached || !cached.url) return;

                    const audio = new Audio(cached.url);
                    this.currentAudioSource = audio;
                    this.isSpeaking = true;

                    audio.onended = () => {
                        this.isSpeaking = false;
                        this.currentAudioSource = null;
                        if (this.autoplay && this.currentSlideIndex < this.slides.length - 1) {
                            setTimeout(() => this.nextSlide(), 800);
                        }
                    };

                    audio.onerror = () => {
                        this.isSpeaking = false;
                        this.currentAudioSource = null;
                    };

                    audio.play();
                },

                playBrowserTTS(text) {
                    if (!('speechSynthesis' in window)) {
                        alert("Váš prohlížeč nepodporuje hlasové předčítání.");
                        return;
                    }

                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'cs-CZ';
                    utterance.rate = 1.0;

                    utterance.onstart = () => {
                        this.isSpeaking = true;
                    };

                    utterance.onend = () => {
                        this.isSpeaking = false;
                        if (this.autoplay && this.currentSlideIndex < this.slides.length - 1) {
                            setTimeout(() => this.nextSlide(), 800);
                        }
                    };

                    utterance.onerror = () => {
                        this.isSpeaking = false;
                    };

                    window.speechSynthesis.speak(utterance);
                },

                stopAudio() {
                    if (this.currentAudioSource) {
                        try {
                            this.currentAudioSource.pause();
                            this.currentAudioSource = null;
                        } catch(e) {}
                    }
                    if ('speechSynthesis' in window) {
                        window.speechSynthesis.cancel();
                    }
                    this.isSpeaking = false;
                    this.ttsLoading = false;
                },

                base64ToArrayBuffer(base64) {
                    const binaryString = window.atob(base64);
                    const len = binaryString.length;
                    const bytes = new Uint8Array(len);
                    for (let i = 0; i < len; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }
                    return bytes.buffer;
                },

                pcmToWav(pcm16, sampleRate = 24000) {
                    const numChannels = 1;
                    const bytesPerSample = 2;
                    const blockAlign = numChannels * bytesPerSample;
                    const byteRate = sampleRate * blockAlign;
                    const dataSize = pcm16.length * bytesPerSample;
                    const buffer = new ArrayBuffer(44 + dataSize);
                    const view = new DataView(buffer);

                    // RIFF chunk descriptor
                    this.writeString(view, 0, 'RIFF');
                    view.setUint32(4, 36 + dataSize, true);
                    this.writeString(view, 8, 'WAVE');

                    // fmt sub-chunk
                    this.writeString(view, 12, 'fmt ');
                    view.setUint32(16, 16, true);
                    view.setUint16(20, 1, true); // Linear PCM
                    view.setUint16(22, numChannels, true);
                    view.setUint32(24, sampleRate, true);
                    view.setUint32(28, byteRate, true);
                    view.setUint16(32, blockAlign, true);
                    view.setUint16(34, 16, true); // Bits per sample

                    // data sub-chunk
                    this.writeString(view, 36, 'data');
                    view.setUint32(40, dataSize, true);

                    // Write PCM samples
                    let offset = 44;
                    for (let i = 0; i < pcm16.length; i++, offset += 2) {
                        view.setInt16(offset, pcm16[i], true);
                    }

                    return new Blob([buffer], { type: 'audio/wav' });
                },

                writeString(view, offset, string) {
                    for (let i = 0; i < string.length; i++) {
                        view.setUint8(offset + i, string.charCodeAt(i));
                    }
                },

                init() {
                    window.addEventListener('keydown', (e) => {
                        if (e.key === 'ArrowRight' || e.key === ' ') {
                            e.preventDefault();
                            this.nextSlide();
                        } else if (e.key === 'ArrowLeft') {
                            e.preventDefault();
                            this.prevSlide();
                        }
                    });
                }
            };
        }
    </script>
</body>
</html>
